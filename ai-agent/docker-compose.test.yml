services:
  postgres-test:
    image: postgres:16-alpine
    container_name: venergy_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: v_energy_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
